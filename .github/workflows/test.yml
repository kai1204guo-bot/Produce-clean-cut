name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - name: Install project with OCR test dependencies
        run: python -m pip install ".[ocr,dev]"
      - name: Lint source and tests
        run: ruff check src tests
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests
