[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "produce-clean-cut"
version = "0.4.1"
description = "Local pipeline for extracting subtitles and producing clean video copies."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "Proprietary" }
authors = [{ name = "Produce Clean Cut contributors" }]
dependencies = []

[project.optional-dependencies]
repair = [
    "opencv-python>=4.10,<6",
]
sttn = [
    "torch>=2.7,<2.12",
]
ocr = [
    "onnxruntime>=1.22,<1.27",
    "rapidocr>=3.8,<4",
]
ocr-gpu = [
    "onnxruntime-gpu[cuda,cudnn]>=1.22,<1.27",
    "rapidocr>=3.8,<4",
]
asr = [
    "faster-whisper>=1.2,<2",
]
desktop = [
    "faster-whisper>=1.2,<2",
    "playwright>=1.55,<2",
]
dev = [
    "pillow>=11,<13",
    "ruff>=0.12,<1",
]

[project.scripts]
clean-cut = "clean_cut.cli:main"
clean-cut-gui = "clean_cut.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clean_cut"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
